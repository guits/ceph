roles:
- - mon.a
  - mgr.x
  - osd.0
  - client.0
openstack:
- volumes:
    count: 2
    size: 10
overrides:
  ceph:
    log-ignorelist:
      - OSD_DOWN
      - CEPHADM_FAILED_DAEMON
      - CEPHADM_AGENT_DOWN
      - PG_DEGRADED
    log-only-match:
      - CEPHADM_
    conf:
      osd:
        osd shutdown pgref assert: true
tasks:
- cephadm:
    skip_dashboard: true
- workunit:
    clients:
      client.0:
        - ceph-volume/scenario_zap_recreate.sh
