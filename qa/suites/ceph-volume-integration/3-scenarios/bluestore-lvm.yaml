roles:
- - mon.a
  - mgr.x
  - osd.0
  - osd.1
  - osd.2
  - client.0
openstack:
- volumes:
    count: 4
    size: 10
overrides:
  ceph:
    log-ignorelist:
      - OSD_DOWN
      - CEPHADM_FAILED_DAEMON
      - CEPHADM_AGENT_DOWN
      - PG_DEGRADED
    log-only-match:
      - CEPHADM_
    conf:
      osd:
        osd shutdown pgref assert: true
tasks:
- cephadm:
    skip_dashboard: true
- cephadm.shell:
    mon.a:
      - ceph orch status
      - ceph orch ps
      - ceph osd stat
      - test "$(ceph osd stat -f json | jq '.num_up_osds')" -ge 3
      - ceph-volume lvm list
