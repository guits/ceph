roles:
- - mon.a
  - mgr.x
  - client.0
openstack:
- volumes:
    count: 2
    size: 10
overrides:
  ceph:
    log-ignorelist:
      - OSD_DOWN
      - CEPHADM_FAILED_DAEMON
      - CEPHADM_AGENT_DOWN
      - PG_DEGRADED
    log-only-match:
      - CEPHADM_
    conf:
      osd:
        osd shutdown pgref assert: true
  cephadm:
    skip_osd_deploy: true
tasks:
- cephadm:
    skip_dashboard: true
- cephadm.apply:
    specs:
    - service_type: osd
      service_id: cv-bluestore-raw
      placement:
        host_pattern: '*'
      spec:
        data_devices:
          limit: 2
        method: raw
        objectstore: bluestore
- cephadm.wait_for_service:
    service: osd.cv-bluestore-raw
    timeout: 900
- cephadm.shell:
    mon.a:
      - ceph orch ps
      - test "$(ceph osd stat -f json | jq '.num_up_osds')" -ge 1
      - |
          if ceph-volume lvm list; then
            echo "expected no LVM OSD metadata for raw deployment"
            exit 1
          fi
