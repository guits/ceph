# Requires baremetal with a TPM2 chip. Raw dmcrypt without TPM needs
# CEPH_VOLUME_DMCRYPT_SECRET, which cephadm cannot pass today.
roles:
- - mon.a
  - mgr.x
  - client.0
openstack:
- volumes:
    count: 1
    size: 10
overrides:
  ceph:
    log-ignorelist:
      - OSD_DOWN
      - CEPHADM_FAILED_DAEMON
      - CEPHADM_AGENT_DOWN
      - PG_DEGRADED
    log-only-match:
      - CEPHADM_
    conf:
      osd:
        osd shutdown pgref assert: true
  cephadm:
    skip_osd_deploy: true
tasks:
- cephadm:
    skip_dashboard: true
- cephadm.apply:
    specs:
    - service_type: osd
      service_id: cv-raw-dmcrypt-tpm2
      placement:
        host_pattern: '*'
      spec:
        data_devices:
          limit: 1
        encrypted: true
        tpm2: true
        method: raw
        objectstore: bluestore
- cephadm.wait_for_service:
    service: osd.cv-raw-dmcrypt-tpm2
    timeout: 900
- cephadm.shell:
    mon.a:
      - ceph orch ps
      - test "$(ceph osd stat -f json | jq '.num_up_osds')" -ge 1
      - |
          if ceph-volume lvm list; then
            echo "expected no LVM OSDs for raw deployment"
            exit 1
          fi
