[tox]
envlist =
    flake8
    mypy
    check-black
    py3
skipsdist = true
# REMINDER: run `tox -e format-black` to apply black formatting
# with the exact same specs as `check-black` expects.

[flake8]
max-line-length = 100
inline-quotes = '
ignore =
    E501,
    E203,
    W503,
exclude =
    .tox,
    .vagrant,
    __pycache__,
    *.pyc,
    templates,
    .eggs
statistics = True

[testenv]
setenv =
    PYTHONPATH = $PYTHONPATH:..:{toxinidir}/../python-common
passenv =
    PYTHONPATH
skip_install=true
deps =
  -rzipapp-reqs.txt
  pyfakefs == 4.5.6 ; python_version < "3.7"
  pyfakefs >= 5.3.5 ; python_version >= "3.7"
  mock
  pytest
  pytest-timeout
  pyyaml
commands=pytest --timeout={env:PYTEST_TIMEOUT:120}  --session-timeout={env:PYTEST_SESSION_TIMEOUT:3600} {posargs}

[testenv:mypy]
setenv =
    MYPYPATH = {toxinidir}/..:{toxinidir}/../python-common
passenv =
    MYPYPATH
deps =
    mypy
    types-PyYAML
    -rzipapp-reqs.txt
    -c{toxinidir}/../mypy-constrains.txt
commands = mypy --config-file ../mypy.ini {posargs:cephadm.py cephadm_invoker.py cephadmlib}

[testenv:flake8]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/../python-common
deps =
    flake8
    flake8-quotes
commands =
    flake8 --config=tox.ini {posargs:cephadm.py cephadm_invoker.py cephadmlib tests/check_default_registries.py}
    python {toxinidir}/tests/check_default_registries.py
# Downstream distributions may choose to alter EXPECTED_COUNTS in
# tests/check_default_registries.py, to make sure no new image reference
# in images.py is creeping in unnoticed. The same command fails if
# DefaultImages, DEFAULT_IMAGE or DEFAULT_REGISTRY uses a registry that
# is not a key of that table.

# coverage env is intentionally left out of the envlist. It is here for developers
# to run locally to generate and review test coverage of cephadm.
[testenv:coverage]
skip_install=true
deps =
  {[testenv]deps}
  pytest-cov
commands =
  pytest -v --cov=cephadm --cov=cephadmlib --cov-report=term-missing --cov-report=html {posargs}

[testenv:check-black]
deps =
    black>=23,<24
commands =
    black --check -l78 -t py36 --skip-string-normalization -v cephadmlib/

[testenv:format-black]
deps =
    black>=23,<24
commands =
    black -q -l78 -t py36 --skip-string-normalization cephadmlib/

# test_build env is intentionally left out of the envlist. It is here for developers
# to run locally as it has some unusual requirements: needs podman, etc
[testenv:test_build]
skip_install=true
deps =
  {[testenv]deps}
commands =
  pytest {posargs} tests/build
